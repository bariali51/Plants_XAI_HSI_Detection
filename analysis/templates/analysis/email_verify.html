{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Email | Nabtati</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-color); }
        .verify-card { max-width: 480px; width: 100%; margin: 20px; text-align: center; }
        .verify-icon { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, rgba(46,125,50,0.1), rgba(46,125,50,0.2)); display: flex; align-items: center; justify-content: center; font-size: 36px; margin: 0 auto 24px; }
        .verify-title { font-size: 24px; font-weight: 900; margin-bottom: 8px; color: var(--text-main); }
        .verify-text { font-size: 15px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }
        .email-highlight { background: var(--primary-bg); color: var(--primary-dark); padding: 4px 12px; border-radius: 8px; font-weight: 700; display: inline-block; margin: 8px 0; }

        /* Code Input */
        .code-form { margin: 20px 0; }
        .code-inputs {
            display: flex; gap: 8px; justify-content: center; margin-bottom: 20px;
        }
        .code-input {
            width: 52px; height: 60px; text-align: center;
            font-size: 24px; font-weight: 800; font-family: 'Inter', monospace;
            border: 2px solid var(--border); border-radius: 12px;
            background: var(--surface); color: var(--text-main);
            outline: none; transition: all 0.2s;
        }
        .code-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(46,125,50,0.15);
            transform: translateY(-2px);
        }
        .code-input.filled {
            border-color: var(--primary);
            background: var(--primary-bg);
        }
        .code-input.error-input {
            border-color: #ef4444;
            box-shadow: 0 0 0 4px rgba(239,68,68,0.1);
        }

        .verify-btn {
            width: 100%; padding: 14px;
            border: none; border-radius: 12px;
            background: linear-gradient(135deg, #2e7d32, #43a047);
            color: white; font-family: inherit;
            font-weight: 700; font-size: 15px;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(46,125,50,0.2);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .verify-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(46,125,50,0.35); }
        .verify-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .error-msg {
            background: rgba(254,226,226,0.8); color: #dc2626;
            padding: 10px 16px; border-radius: 10px;
            font-size: 13px; font-weight: 600;
            margin-bottom: 16px; border: 1px solid #fca5a5;
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

        .success-msg {
            background: rgba(220,252,231,0.8); color: #166534;
            padding: 10px 16px; border-radius: 10px;
            font-size: 13px; font-weight: 600;
            margin-bottom: 16px; border: 1px solid #86efac;
        }

        .resend-form { margin-top: 16px; }
        .resend-btn {
            background: none; border: none; color: var(--primary); font-weight: 700;
            cursor: pointer; font-size: 14px; text-decoration: underline; font-family: inherit;
            transition: color 0.2s;
        }
        .resend-btn:hover { color: var(--primary-dark); }
        .resend-btn:disabled { color: var(--text-muted); cursor: not-allowed; text-decoration: none; }

        .timer { font-size: 12px; color: var(--text-muted); margin-top: 8px; }

        @media (max-width: 480px) {
            .code-input { width: 44px; height: 52px; font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="card verify-card" style="padding: 48px 36px;">
        <div class="verify-icon">📧</div>
        <h1 class="verify-title">Verify Your Email</h1>
        <p class="verify-text">
            We've sent a 6-digit verification code to:<br>
            <span class="email-highlight">{{ email }}</span>
        </p>

        {% if error %}
        <div class="error-msg">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}

        <!-- 6-Digit Code Input -->
        <form method="POST" action="{% url 'verify_code' %}" class="code-form" id="codeForm">
            {% csrf_token %}
            <input type="hidden" name="user_pk" value="{{ user_pk }}">
            <input type="hidden" name="email" value="{{ email }}">
            <input type="hidden" name="code" id="fullCode" value="">

            <div class="code-inputs" id="codeInputs">
                <input type="text" maxlength="1" class="code-input" data-index="0" inputmode="numeric" pattern="[0-9]" autocomplete="one-time-code">
                <input type="text" maxlength="1" class="code-input" data-index="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" class="code-input" data-index="2" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" class="code-input" data-index="3" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" class="code-input" data-index="4" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" class="code-input" data-index="5" inputmode="numeric" pattern="[0-9]">
            </div>

            <button type="submit" class="verify-btn" id="verifyBtn" disabled>
                <i class="fas fa-shield-check"></i> Verify Email
            </button>
        </form>

        <div style="background: var(--bg-color); border-radius: 12px; padding: 16px; border: 1px solid var(--border); text-align: left; margin: 16px 0;">
            <p style="font-size: 13px; color: var(--text-muted); margin: 0;">
                <i class="fas fa-clock" style="color: var(--primary); margin-right: 6px;"></i>
                <strong>Code expires in 15 minutes.</strong> Check your spam folder if you don't see it.
            </p>
        </div>

        <form method="POST" action="{% url 'resend_verification' %}" class="resend-form">
            {% csrf_token %}
            <input type="hidden" name="user_pk" value="{{ user_pk }}">
            <button type="submit" class="resend-btn" id="resendBtn">
                <i class="fas fa-redo"></i> Resend Verification Code
            </button>
            <div class="timer" id="timerText"></div>
        </form>

        <a href="{% url 'login' %}" style="display: block; margin-top: 16px; font-size: 13px; color: var(--text-muted); text-decoration: none;">
            <i class="fas fa-arrow-left"></i> Back to Login
        </a>
    </div>

    <script>
    (function() {
        const inputs = document.querySelectorAll('.code-input');
        const fullCode = document.getElementById('fullCode');
        const verifyBtn = document.getElementById('verifyBtn');
        const form = document.getElementById('codeForm');

        // Focus first input
        inputs[0].focus();

        function updateCode() {
            let code = '';
            inputs.forEach(i => { code += i.value; });
            fullCode.value = code;
            verifyBtn.disabled = code.length !== 6;

            inputs.forEach(i => {
                if (i.value) {
                    i.classList.add('filled');
                    i.classList.remove('error-input');
                } else {
                    i.classList.remove('filled');
                }
            });
        }

        inputs.forEach((input, idx) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value.replace(/[^0-9]/g, '');
                e.target.value = val.slice(0, 1);
                updateCode();
                if (val && idx < 5) inputs[idx + 1].focus();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && idx > 0) {
                    inputs[idx - 1].focus();
                    inputs[idx - 1].value = '';
                    updateCode();
                }
                if (e.key === 'Enter' && fullCode.value.length === 6) {
                    form.submit();
                }
            });

            // Handle paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasted = (e.clipboardData.getData('text') || '').replace(/[^0-9]/g, '').slice(0, 6);
                for (let i = 0; i < pasted.length && (idx + i) < 6; i++) {
                    inputs[idx + i].value = pasted[i];
                }
                updateCode();
                const nextIdx = Math.min(idx + pasted.length, 5);
                inputs[nextIdx].focus();
            });
        });

        // Resend cooldown (60 seconds)
        const resendBtn = document.getElementById('resendBtn');
        const timerText = document.getElementById('timerText');
        let cooldown = 60;

        function startCooldown() {
            resendBtn.disabled = true;
            const timer = setInterval(() => {
                cooldown--;
                timerText.textContent = `Resend available in ${cooldown}s`;
                if (cooldown <= 0) {
                    clearInterval(timer);
                    resendBtn.disabled = false;
                    timerText.textContent = '';
                }
            }, 1000);
        }

        startCooldown();
    })();
    </script>
</body>
</html>
