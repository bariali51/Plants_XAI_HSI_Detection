{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified | Nabtati</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-color); }
        .success-card { max-width: 480px; width: 100%; margin: 20px; text-align: center; }
        .success-icon { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, rgba(34,197,94,0.1), rgba(34,197,94,0.2)); display: flex; align-items: center; justify-content: center; font-size: 36px; margin: 0 auto 24px; }
    </style>
</head>
<body>
    <div class="card success-card" style="padding: 48px 36px;">
        <div class="success-icon">✅</div>
        <h1 style="font-size: 24px; font-weight: 900; margin-bottom: 8px; color: var(--text-main);">
            Email Verified!
        </h1>
        <p style="font-size: 15px; color: var(--text-muted); line-height: 1.6; margin-bottom: 28px;">
            Your email has been verified successfully.
            {% if user %}Welcome, <strong>{{ user.first_name|default:user.username }}</strong>!{% endif %}
            You can now log in and start using Nabtati.
        </p>

        <a href="{% url 'login' %}" style="
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 32px; border-radius: 12px;
            background: linear-gradient(135deg, #2e7d32, #1b5e20); color: #fff;
            font-weight: 800; font-size: 15px; text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 16px rgba(46,125,50,0.3);
        " onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform='none'">
            <i class="fas fa-sign-in-alt"></i> Log In Now
        </a>
    </div>
</body>
</html>
